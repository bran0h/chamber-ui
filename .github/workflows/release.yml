name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: ${{ matrix.job.name }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - name: macOS-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            bundle: release/darwin/x86_64
            arch: x64

          - name: macOS-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            bundle: release/darwin/aarch64
            arch: aarch64

          - name: Windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: release/windows/x86_64
            arch: x64

          - name: Linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: release/linux/x86_64
            arch: amd64

          - name: Linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: release/linux/aarch64
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.job.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev xdg-utils

      - name: Get App version
        shell: bash
        run: echo "APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> $GITHUB_ENV

      # Detect whether Apple signing secrets are configured
      - name: Check Apple signing
        if: runner.os == 'macOS'
        id: apple
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: echo "has_cert=${{ env.CERT != '' }}" >> $GITHUB_OUTPUT

      # macOS with Apple Developer certificate (notarized)
      - name: Build App (macOS signed)
        if: runner.os == 'macOS' && steps.apple.outputs.has_cert == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.job.target }}

      # macOS without certificate — produces unsigned DMG (users must right-click → Open)
      - name: Build App (macOS unsigned)
        if: runner.os == 'macOS' && steps.apple.outputs.has_cert != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.job.target }}

      # Windows / Linux — no Apple vars needed
      - name: Build App
        if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.job.target }}

      - name: List bundle artifacts
        shell: bash
        run: find src-tauri/target/${{ matrix.job.target }}/release/bundle -type f | sort

      - name: Organize files (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ${{ matrix.job.bundle }}
          BUNDLE="src-tauri/target/${{ matrix.job.target }}/release/bundle"
          mv "$BUNDLE/dmg/chamber-ui_${{ env.APP_VERSION }}_${{ matrix.job.arch }}.dmg" "${{ matrix.job.bundle }}/chamber-ui.dmg"
          mv "$BUNDLE/macos/chamber-ui.app.tar.gz" "${{ matrix.job.bundle }}/chamber-ui.app.tar.gz"
          SIG=$(cat "$BUNDLE/macos/chamber-ui.app.tar.gz.sig")
          echo "{\"version\":\"${{ env.APP_VERSION }}\",\"url\":\"${{ secrets.R2_PUBLIC_URL }}/${{ matrix.job.bundle }}/chamber-ui.app.tar.gz\",\"signature\":\"$SIG\"}" \
            > "${{ matrix.job.bundle }}/latest.json"
          cp "${{ matrix.job.bundle }}/chamber-ui.dmg" "${{ matrix.job.bundle }}/chamber-ui-${{ env.APP_VERSION }}.dmg"

      - name: Organize files (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ${{ matrix.job.bundle }}
          BUNDLE="src-tauri/target/${{ matrix.job.target }}/release/bundle"
          mv "$BUNDLE/appimage/chamber-ui_${{ env.APP_VERSION }}_${{ matrix.job.arch }}.AppImage" "${{ matrix.job.bundle }}/chamber-ui.AppImage"
          SIG=$(cat "$BUNDLE/appimage/chamber-ui_${{ env.APP_VERSION }}_${{ matrix.job.arch }}.AppImage.sig")
          echo "{\"version\":\"${{ env.APP_VERSION }}\",\"url\":\"${{ secrets.R2_PUBLIC_URL }}/${{ matrix.job.bundle }}/chamber-ui.AppImage\",\"signature\":\"$SIG\"}" \
            > "${{ matrix.job.bundle }}/latest.json"
          cp "${{ matrix.job.bundle }}/chamber-ui.AppImage" "${{ matrix.job.bundle }}/chamber-ui-${{ env.APP_VERSION }}.AppImage"

      - name: Organize files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ${{ matrix.job.bundle }}
          BUNDLE="src-tauri/target/${{ matrix.job.target }}/release/bundle"
          mv "$BUNDLE/nsis/chamber-ui_${{ env.APP_VERSION }}_${{ matrix.job.arch }}-setup.exe" "${{ matrix.job.bundle }}/chamber-ui-Setup.exe"
          SIG=$(cat "$BUNDLE/nsis/chamber-ui_${{ env.APP_VERSION }}_${{ matrix.job.arch }}-setup.exe.sig")
          echo "{\"version\":\"${{ env.APP_VERSION }}\",\"url\":\"${{ secrets.R2_PUBLIC_URL }}/${{ matrix.job.bundle }}/chamber-ui-Setup.exe\",\"signature\":\"$SIG\"}" \
            > "${{ matrix.job.bundle }}/latest.json"
          cp "${{ matrix.job.bundle }}/chamber-ui-Setup.exe" "${{ matrix.job.bundle }}/chamber-ui-Setup-${{ env.APP_VERSION }}.exe"

      - name: Upload to R2
        uses: wyhaya/upload-cloudflare-r2@9ac9d847e87f5674ed5f14c11a2f0f44d8a5c368
        with:
          account_id: ${{ secrets.R2_ACCOUNT_ID }}
          access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.R2_BUCKET }}
          source_directory: ${{ matrix.job.bundle }}
          destination_directory: ${{ matrix.job.bundle }}
          cache_control: |
            .*              public, max-age=0, must-revalidate

            # Versioned filenames (e.g. chamber-ui-0.1.0.dmg) are immutable
            (\d+\.)+\w+$    public, max-age=2678400, immutable

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          R2: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          VER="${TAG#v}"
          cat <<EOF > notes.md
          ## Downloads

          | Platform | Architecture | Download |
          |----------|-------------|---------|
          | macOS | Apple Silicon (aarch64) | [chamber-ui-${VER}.dmg](${R2}/release/darwin/aarch64/chamber-ui-${VER}.dmg) |
          | macOS | Intel (x64) | [chamber-ui-${VER}.dmg](${R2}/release/darwin/x86_64/chamber-ui-${VER}.dmg) |
          | Windows | x64 | [chamber-ui-Setup-${VER}.exe](${R2}/release/windows/x86_64/chamber-ui-Setup-${VER}.exe) |
          | Linux | x64 | [chamber-ui-${VER}.AppImage](${R2}/release/linux/x86_64/chamber-ui-${VER}.AppImage) |
          | Linux | aarch64 | [chamber-ui-${VER}.AppImage](${R2}/release/linux/aarch64/chamber-ui-${VER}.AppImage) |
          EOF

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Chamber UI $TAG" \
            --notes-file notes.md
